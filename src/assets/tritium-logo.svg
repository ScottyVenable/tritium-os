<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="inner-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagonal Shield -->
  <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="rgba(6, 182, 212, 0.03)" stroke="url(#crystal-gradient)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Inner Crystalline Tri-Prong Core -->
  <path d="M50,18 V46 L74,60" stroke="url(#crystal-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M50,46 L26,60" stroke="url(#crystal-gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Core Spark -->
  <circle cx="50" cy="46" r="8" fill="url(#inner-glow)" />
  <circle cx="50" cy="46" r="3" fill="#ffffff" />
</svg>
